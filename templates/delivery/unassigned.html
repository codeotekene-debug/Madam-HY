{% extends 'delivery/base.html' %}{% block delivery_content %}<section class="delivery-panel"><h2>Unassigned delivery queue</h2>{% for d in deliveries %}<article class="delivery-card"><h3>{{ d.order.order_number }} · {{ d.customer_name }}</h3><p>{{ d.delivery_address }} · {{ d.customer_phone }}</p><form class="delivery-form" method="post" action="{% url 'delivery:management_assign_rider' d.id %}">{% csrf_token %}<label>Available rider <select name="rider_id" required><option value="">Select rider</option>{% for profile in riders %}<option value="{{ profile.user.id }}">{{ profile.full_name }} · {{ profile.get_vehicle_type_display }}</option>{% endfor %}</select></label><button>Assign rider</button></form></article>{% empty %}<p>Queue is clear.</p>{% endfor %}</section>{% endblock %}
