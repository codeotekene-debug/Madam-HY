{% extends 'delivery/base.html' %}{% block delivery_content %}<section class="delivery-panel"><h2>All deliveries</h2><form class="delivery-form" method="get"><label>Search <input name="q" value="{{ search }}" placeholder="Order, tracking, customer"></label><label>Status <select name="status"><option value="">All</option>{% for key,label in statuses %}<option value="{{ key }}" {% if status_filter == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button>Apply filters</button></form>{% include 'delivery/_table.html' with rows=deliveries %}</section>{% endblock %}
