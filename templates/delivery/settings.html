{% extends 'delivery/base.html' %}{% block delivery_content %}<section class="delivery-panel"><h2>Delivery settings</h2><form method="post">{% csrf_token %}<div class="delivery-grid"><label>OTP expiry in minutes <input type="number" min="1" max="1440" name="otp_expiry_minutes" value="{{ settings.otp_expiry_minutes }}"></label><label>Maximum OTP tries <input type="number" min="1" max="10" name="max_otp_attempts" value="{{ settings.max_otp_attempts }}"></label><label>Default concurrent jobs <input type="number" min="1" name="max_active_deliveries_per_rider" value="{{ settings.max_active_deliveries_per_rider }}"></label><label>Support phone <input name="support_phone" value="{{ settings.support_phone }}"></label><label><input type="checkbox" name="allow_management_override" value="true" {% if settings.allow_management_override %}checked{% endif %}> Allow manager delivery confirmation override</label><label><input type="checkbox" name="auto_assign_enabled" value="true" {% if settings.auto_assign_enabled %}checked{% endif %}> Enable auto assignment</label></div><button>Save settings</button></form></section>{% endblock %}
