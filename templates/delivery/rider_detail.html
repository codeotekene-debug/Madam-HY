{% extends 'delivery/base.html' %}{% block delivery_content %}<section class="delivery-panel"><h2>{{ rider.get_full_name|default:rider.username }}</h2><form method="post">{% csrf_token %}<div class="delivery-grid"><label>Phone <input name="phone_number" value="{{ profile.phone_number }}"></label><label>Vehicle <select name="vehicle_type">{% for key,label in vehicle_types %}<option value="{{ key }}" {% if profile.vehicle_type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Plate <input name="vehicle_number" value="{{ profile.vehicle_number }}"></label><label>License <input name="license_number" value="{{ profile.license_number }}"></label><label>Max active jobs <input type="number" name="max_active_deliveries" min="1" value="{{ profile.max_active_deliveries }}"></label><label>Internal notes <textarea name="notes">{{ profile.notes }}</textarea></label></div><button>Save profile</button></form></section><section class="delivery-panel"><h2>Recent jobs</h2>{% include 'delivery/_table.html' with rows=deliveries %}</section>{% endblock %}
