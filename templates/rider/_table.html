{% if rows %}<div class="table-wrapper table-responsive delivery-table-scroll" role="region" tabindex="0" aria-label="My delivery list, horizontally scrollable"><table class="table"><thead><tr><th scope="col">Order</th><th scope="col">Destination</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody>{% for d in rows %}<tr><td>{{ d.order.order_number }}</td><td>{{ d.delivery_address }}</td><td>{{ d.get_status_display }}</td><td><a href="{% url 'delivery:rider_delivery_detail' d.id %}" aria-label="Open delivery for order {{ d.order.order_number }}">Open</a></td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="delivery-muted">No deliveries in this section.</p>{% endif %}
