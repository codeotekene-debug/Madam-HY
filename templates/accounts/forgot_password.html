{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | MADAM HY</title>

    <link rel="stylesheet" href="{% static 'css/core/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/tables.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/accounts/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/accounts/password.css' %}">
</head>

<body>
    <main class="auth-shell password-shell">
        <section class="auth-panel password-panel" aria-labelledby="forgotTitle">
            <a href="#" class="auth-brand" aria-label="MADAM HY home">
                <span class="auth-logo">HY</span>
                <span>
                    <strong>MADAM HY</strong>
                    <small>Smart Shop</small>
                </span>
            </a>

            <div class="auth-card">
                <div class="auth-header">
                    <span class="badge badge-primary">Password help</span>

                    <h1 id="forgotTitle">Reset your password</h1>

                    <p>
                        Enter the email address connected to your MADAM HY
                        account.
                    </p>
                </div>

                <div
                    class="alert alert-info account-message"
                    id="passwordMessage"
                    role="status"
                    aria-live="polite"
                    hidden
                >
                </div>

                <form
                    class="account-form"
                    id="forgotPasswordForm"
                    method="post"
                    novalidate
                    data-demo-form
                >
                    {% csrf_token %}

                    <div class="form-group">
                        <label class="form-label" for="resetEmail">
                            Email address
                            <span class="required">*</span>
                        </label>

                        <input
                            class="form-control"
                            type="email"
                            id="resetEmail"
                            name="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >

                        <span class="form-error" data-error-for="resetEmail"></span>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg" type="submit">
                        Continue
                    </button>
                </form>

                <p class="auth-footer">
                    Remembered it?
                    <a href="#" class="text-link">Back to sign in</a>
                </p>
            </div>
        </section>
    </main>

    <script src="{% static 'js/pages/accounts/login.js' %}"></script>
</body>

</html>
