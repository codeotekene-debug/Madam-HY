{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Reset | MADAM HY</title>

    <link rel="stylesheet" href="{% static 'css/core/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/tables.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/accounts/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/accounts/password.css' %}">
</head>

<body>
    <main class="auth-shell password-shell">
        <section class="auth-panel password-panel" aria-labelledby="resetTitle">
            <a href="#" class="auth-brand" aria-label="MADAM HY home">
                <span class="auth-logo">HY</span>
                <span>
                    <strong>MADAM HY</strong>
                    <small>Smart Shop</small>
                </span>
            </a>

            <div class="auth-card">
                <div class="auth-header">
                    <span class="badge badge-primary">New password</span>

                    <h1 id="resetTitle">Choose a new password</h1>

                    <p>
                        Create a password that is easy for you to remember
                        and difficult for others to guess.
                    </p>
                </div>

                <div
                    class="alert alert-info account-message"
                    id="resetMessage"
                    role="status"
                    aria-live="polite"
                    hidden
                >
                </div>

                <form
                    class="account-form"
                    id="resetPasswordForm"
                    method="post"
                    novalidate
                    data-demo-form
                >
                    {% csrf_token %}

                    <div class="form-group">
                        <label class="form-label" for="newPassword">
                            New password
                            <span class="required">*</span>
                        </label>

                        <div class="password-field">
                            <input
                                class="form-control"
                                type="password"
                                id="newPassword"
                                name="new_password"
                                autocomplete="new-password"
                                required
                                data-strength-source
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="newPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>

                        <div
                            class="password-strength"
                            data-strength-meter
                            aria-hidden="true"
                        >
                            <span></span>
                        </div>

                        <span class="form-help" data-strength-label>
                            Use at least 8 characters.
                        </span>

                        <span class="form-error" data-error-for="newPassword"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="newPasswordConfirm">
                            Confirm new password
                            <span class="required">*</span>
                        </label>

                        <div class="password-field">
                            <input
                                class="form-control"
                                type="password"
                                id="newPasswordConfirm"
                                name="new_password_confirm"
                                autocomplete="new-password"
                                required
                                data-confirm-password="newPassword"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="newPasswordConfirm"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>

                        <span class="form-error" data-error-for="newPasswordConfirm"></span>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg" type="submit">
                        Save password
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="{% static 'js/pages/accounts/register.js' %}"></script>
</body>

</html>
