# ==============================================================================
# MADAM HY SMART SHOP — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # DATABASE SERVICE (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: smart_shop_db
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    environment:
      MYSQL_DATABASE: ${DB_NAME:-madam_hy}
      MYSQL_USER: ${DB_USER:-madam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Database password required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Database root password required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smart_shop_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # WEB APPLICATION SERVICE (Django + Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: smart_shop_web
    restart: always
    env_file:
      - ../../.env.production
    environment:
      - DEBUG=False
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - SECURE_PROXY_SSL_HEADER=True
    command: >
      gunicorn
      --bind 0.0.0.0:8000
      --workers 3
      --threads 2
      --worker-class gthread
      --timeout 60
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      config.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart_shop_network
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # REVERSE PROXY SERVICE (Nginx Alpine)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: smart_shop_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/smart_shop_docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - smart_shop_network

# ------------------------------------------------------------------------------
# PERSISTENT VOLUMES
# ------------------------------------------------------------------------------
volumes:
  db_data:
    name: smart_shop_db_data
  static_volume:
    name: smart_shop_static_volume
  media_volume:
    name: smart_shop_media_volume
  logs_volume:
    name: smart_shop_logs_volume

# ------------------------------------------------------------------------------
# ISOLATED BRIDGED NETWORK
# ------------------------------------------------------------------------------
networks:
  smart_shop_network:
    name: smart_shop_network
    driver: bridge
