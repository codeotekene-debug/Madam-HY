# ==============================================================================
# MADAM HY SMART SHOP — NGINX PRODUCTION CONFIGURATION (BARE-METAL / VPS)
# ==============================================================================

# Upstream Gunicorn WSGI application server via Unix domain socket
upstream smart_shop_upstream {
    server unix:/run/smart_shop/gunicorn.sock fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (PORT 80) — REDIRECT TO HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name smartshop.example.com app.smartshop.ng;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Strict 301 permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (PORT 443) — PRODUCTION APPLICATION SERVER
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartshop.example.com app.smartshop.ng;

    # TLS Certificates (managed via Certbot or custom PKI)
    ssl_certificate /etc/letsencrypt/live/smartshop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartshop.example.com/privkey.pem;

    # Modern TLS Protocols and Cipher Suites (Mozilla Modern standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Maximum client payload size (allows high-res product photos & attachments)
    client_max_body_size 25M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Logging
    access_log /var/log/nginx/smart_shop_access.log combined;
    error_log /var/log/nginx/smart_shop_error.log warn;

    # --------------------------------------------------------------------------
    # STATIC ASSETS (Collectstatic Output)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/smart_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # MEDIA ASSETS (User Uploads)
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/smart_shop/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # MAIN APPLICATION REVERSE PROXY
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://smart_shop_upstream;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection Keep-Alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
